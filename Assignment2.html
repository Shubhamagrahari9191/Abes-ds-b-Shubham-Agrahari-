<!DOCTYPE html>
<html>
<head>
  <title>Bus Booking System</title>
</head>
<body style="font-family: Arial; text-align:center;">

  <div style="border:1px solid black; width:400px; margin:50px auto; padding:20px;">
    <div style="text-align:left;">
      <span style="font-weight:bold;">Logo</span>
    </div>

    <h2>Bus Book Seat</h2>
    <h3>* Welcome to Bus Booking System *</h3>

    <div style="text-align:left; margin-left:50px;">
      <p>User Detail</p>

      <label>User Name: </label>
      <input type="text" style="margin-bottom:10px;"><br>

      <label>User Password: </label>
      <input type="password" style="margin-bottom:10px;"><br>

      <label>User Gender: </label>
      <input type="radio" name="gender"> Male
      <input type="radio" name="gender"> Female <br><br>

      <label>User Select City: </label>
      <select>
        <option>--Select--</option>
        <option>Delhi</option>
        <option>Mumbai</option>
        <option>Kolkata</option>
        <option>Chennai</option>
      </select>
      <br><br>

      <button style="padding:5px 15px;">Book Seat</button>
    </div>

    <div style="margin-top:20px;">
      <div style="border:1px solid black; width:120px; height:70px; margin:auto;">
        Bus Image
      </div>
    </div>
  </div>
</body>
</html>
