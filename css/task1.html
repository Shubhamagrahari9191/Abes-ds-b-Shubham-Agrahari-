<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      text-align: center;
    }
    h2 {
      margin: 20px 0;
    }
    .menu-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
      width: 180px;
    }
    .card img {
      width: 100%;
      height: 120px;
      border-radius: 6px;
    }
    .title {
      font-weight: bold;
      margin: 8px 0 4px 0;
    }
    .price {
      color: #333;
      margin-bottom: 10px;
    }
    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 5px;
      margin: 4px;
      cursor: pointer;
    }
    .add-btn {
      background-color: #e74c3c;
      color: white;
    }
    .order-btn {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <h2>Our Special Menu</h2>
  
  <div class="menu-container">
    <!-- Burger Card -->
    <div class="card">
      <img src="burger.png" alt="Burger">
      <div class="title">Burger</div>
      <div class="price" style="color: gray;">70 Rs</div>
      <button class="btn add-btn">Add</button>
      <button class="btn order-btn">Order</button>
    </div>
    
    <!-- Pizza Card -->
    <div class="card">
      <img src="pizza.png" alt="Pizza">
      <div class="title">Pizza</div>
      <div class="price" style="color: gray;">250 Rs</div>
      <button class="btn add-btn">Add</button>
      <button class="btn order-btn">Order</button>
    </div>
    
    <!-- Coke Card -->
    <div class="card">
      <img src="coke.png" alt="Coke">
      <div class="title">Coke</div>
      <div class="price" style="color: gray;">80 Rs</div>
      <button class="btn add-btn">Add</button>
      <button class="btn order-btn">Order</button>
    </div>
  </div>
</body>
</html>
